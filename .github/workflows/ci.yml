name: Validate plugin

on:
  push:
    branches:
      - 'release/**'
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none

      - name: Validate PHP syntax
        run: find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Validate JavaScript syntax
        run: find assets -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Build installable plugin directory
        run: |
          mkdir -p build/vs-box-quantity-pricing
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='build' \
            --exclude='README.md' \
            --exclude='ROADMAP.md' \
            ./ build/vs-box-quantity-pricing/

      - name: Run official WordPress Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: './build/vs-box-quantity-pricing'
          categories: |
            plugin_repo
            security
            general
          strict: 'true'

      - name: Build installable ZIP
        if: startsWith(github.ref, 'refs/heads/release/')
        run: |
          cd build
          zip -r vs-box-quantity-pricing-release.zip vs-box-quantity-pricing

      - name: Upload installable ZIP
        if: startsWith(github.ref, 'refs/heads/release/')
        uses: actions/upload-artifact@v4
        with:
          name: vs-box-quantity-pricing-release
          path: build/vs-box-quantity-pricing-release.zip
